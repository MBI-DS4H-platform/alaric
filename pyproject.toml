[project]
name = "alaric"
version = "0.1.0"
description = "RNA fragment docking and scoring pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy<2",
    "scipy",
    "zstandard",
    "ruamel.yaml",
    "tqdm",
    "biopython",
    "pyyaml",
    "seamless-core>=0.1.4",
    "sortednp",
]

[tool.setuptools.packages.find]
include = ["alaric*"]

[project.scripts]
alaric-sigil = "alaric.middle.sigil:main"
alaric-deploy = "alaric.middle.deploy:main"
alaric-result-clean = "alaric.middle.result:clean_main"
alaric-result-check = "alaric.middle.result:check_main"
alaric-result-download = "alaric.middle.result:download_main"
alaric-result-upload = "alaric.middle.result:upload_main"
alaric-bridge-estimate = "alaric.bridge_estimate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
