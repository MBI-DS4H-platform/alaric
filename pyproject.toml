[project]
name = "alaric"
version = "0.1.0"
description = "RNA fragment docking and scoring pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy<2",
    "scipy",
    "zstandard",
    "ruamel.yaml",
    "tqdm",
    "biopython",
    "pyyaml",
    "seamless-core>=0.1.4",
    "sortednp",
]

[tool.setuptools.packages.find]
include = ["alaric*"]

[tool.setuptools]
script-files = ["util/alaric-count-poses", "util/alaric-copy"]

[project.scripts]
alaric-sigil = "alaric.middle.sigil:main"
alaric-pool-graph = "alaric.middle.pool_graph:main"
alaric-chain = "alaric.middle.chain:main"
alaric-chain-focus = "alaric.middle.chain_focus:main"
alaric-chain-coordinates = "alaric.middle.chain_coordinates:main"
alaric-deploy = "alaric.middle.deploy:main"
alaric-result-clean = "alaric.middle.result:clean_main"
alaric-result-check = "alaric.middle.result:check_main"
alaric-result-download = "alaric.middle.result:download_main"
alaric-provenance-download = "alaric.middle.result:provenance_download_main"
alaric-result-upload = "alaric.middle.result:upload_main"
alaric-propagate-provenance = "alaric.middle.propagate_provenance:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
